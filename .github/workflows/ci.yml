name: ci
on:
  push:
  pull_request:

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: "**/package-lock.json" }
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
      - run: npm run build
      - name: unit tests (no infra)
        run: npx vitest run test/unit
        env: { SKIP_DB_SETUP: "1" }
      - name: anchors are current and every reference exists
        run: node scripts/check_anchors.mjs
      - name: problem video sources resolve
        run: node scripts/build_problem_videos.mjs > /dev/null
      - name: frontend typecheck + build
        run: npm run build
        working-directory: frontend

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shipevents
          POSTGRES_PASSWORD: shipevents-dev
          POSTGRES_DB: shipevents_test
        ports: ["54310:5432"]
        options: >-
          --health-cmd "pg_isready -U shipevents" --health-interval 2s --health-timeout 3s --health-retries 30
      kafka:
        image: apache/kafka:3.9.1
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:19210,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19210
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
        ports: ["19210:19210"]
        options: >-
          --health-cmd "nc -z localhost 19210" --health-interval 3s --health-timeout 3s --health-retries 40
    env:
      TEST_DATABASE_URL: postgres://shipevents:shipevents-dev@localhost:54310/shipevents_test
      KAFKA_BROKERS: localhost:19210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - name: unit + integration tests (real Kafka and Postgres)
        run: npm test
      - name: failing controls (each protection off must turn its test red)
        run: ./scripts/failing-controls.sh
