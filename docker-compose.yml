# compose project: shipevents  (docker-compose -p shipevents ...)
# Memory budget for the whole project: ~1.1 GiB of limits on a shared 6 GiB colima VM.
services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "19210:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:19210
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 3s
      timeout: 3s
      retries: 40
  postgres:
    image: postgres:16-alpine
    ports:
      - "54310:5432"
    environment:
      POSTGRES_USER: shipevents
      POSTGRES_PASSWORD: shipevents-dev
      POSTGRES_DB: shipevents
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=60", "-c", "work_mem=2MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 160m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipevents -d shipevents"]
      interval: 2s
      timeout: 3s
      retries: 30
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["obs"]
    ports:
      - "9210:9090"
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1d", "--web.enable-lifecycle"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 160m
  grafana:
    image: grafana/grafana:12.2.1
    profiles: ["obs"]
    ports:
      - "3210:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shipevents.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 200m
volumes:
  pgdata:
